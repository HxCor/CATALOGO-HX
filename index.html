<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo 2026 · Proveedores</title>
  <!-- Catálogo 2026: bootstrap seguro -->
  <style>
    html,body{margin:0;min-height:100%;background:#1a1917;font-family:Arial,sans-serif}
    #boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;letter-spacing:.3px}
  </style>
</head>
<body>
  <div id="boot">Cargando Catálogo HX…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('app.html?v=security-20260820-divisas-2', { cache: 'no-store' });
        if (!response.ok) throw new Error(`No se pudo cargar la aplicación (${response.status})`);

        let html = await response.text();
        const mainMarker = '<scr' + 'ipt>\nconst LOGOS';
        const preTag = '<scr' + 'ipt src="security-pre.js?v=20260820"></scr' + 'ipt>\n';
        const postTag = '<scr' + 'ipt src="security-post.js?v=20260820"></scr' + 'ipt>\n';
        const mailTag = '<scr' + 'ipt src="mail-provider.js?v=20260820"></scr' + 'ipt>\n';
        const divisasTag = '<scr' + 'ipt src="divisas-hx-pro.js?v=20260820-2"></scr' + 'ipt>\n';
        const divisasFixTag = '<scr' + 'ipt src="divisas-hx-pro-fix.js?v=20260820-1"></scr' + 'ipt>\n';

        if (!html.includes(mainMarker)) {
          throw new Error('No se encontró el punto de inserción de seguridad.');
        }

        html = html.replace(mainMarker, preTag + mainMarker);
        html = html.replace('</body>', postTag + mailTag + divisasTag + divisasFixTag + '</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById('boot').innerHTML = 'No se pudo iniciar el catálogo. Actualiza la página o contacta al administrador.';
      }
    })();
  </script>
</body>
</html>
