<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo 2026 · Proveedores</title>
  <!-- Catálogo 2026: bootstrap seguro -->
  <style>
    html,body{margin:0;min-height:100%;background:#1a1917;font-family:Arial,sans-serif}
    #boot{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:14px;letter-spacing:.3px}
    #boot::before{content:"";width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#2f9b68;border-radius:50%;animation:hxspin .8s linear infinite}
    @keyframes hxspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot">Cargando Catálogo HX…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('app.html?v=light-ios-20260830-2', { cache: 'force-cache' });
        if (!response.ok) throw new Error(`No se pudo cargar la aplicación (${response.status})`);

        let html = await response.text();
        const mainMarker = '<scr' + 'ipt>\nconst LOGOS';
        const preTag = '<scr' + 'ipt src="security-pre.js?v=20260820"></scr' + 'ipt>\n';
        const runtimeTag = '<scr' + 'ipt defer src="security-runtime.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const postTag = '<scr' + 'ipt defer src="security-post.js?v=rubro-align-20260830-1"></scr' + 'ipt>\n';
        const bankAlignmentTag = '<scr' + 'ipt defer src="card-bank-alignment.js?v=20260824-bank-align-1"></scr' + 'ipt>\n';
        const mailTag = '<scr' + 'ipt defer src="mail-provider.js?v=20260820"></scr' + 'ipt>\n';
        const divisasTag = '<scr' + 'ipt defer src="divisas-hx-pro.js?v=20260822-all-users-1"></scr' + 'ipt>\n';
        const divisasFixTag = '<scr' + 'ipt defer src="divisas-hx-pro-fix.js?v=20260822-navigation-1"></scr' + 'ipt>\n';
        const divisasRefreshTag = '<scr' + 'ipt defer src="divisas-refresh-fix.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const divisasDocsTag = '<scr' + 'ipt defer src="divisas-document-actions.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const laboralTag = '<scr' + 'ipt defer src="laboral-hx.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const laboralAccessTag = '<scr' + 'ipt defer src="laboral-access.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const laboralDismissalTag = '<scr' + 'ipt defer src="laboral-despido.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const laboralImssTag = '<scr' + 'ipt defer src="laboral-imss.js?v=final-20260824-1"></scr' + 'ipt>\n';
        const laboralNavigationFixTag = '<scr' + 'ipt defer src="laboral-navigation-fix.js?v=20260822-all-users-1"></scr' + 'ipt>\n';

        if (!html.includes(mainMarker)) {
          throw new Error('No se encontró el punto de inserción de seguridad.');
        }

        html = html.replace(mainMarker, preTag + mainMarker);
        html = html.replace('</body>', runtimeTag + postTag + bankAlignmentTag + mailTag + divisasTag + divisasFixTag + divisasRefreshTag + divisasDocsTag + laboralTag + laboralAccessTag + laboralDismissalTag + laboralImssTag + laboralNavigationFixTag + '</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById('boot').innerHTML = 'No se pudo iniciar el catálogo. Actualiza la página o contacta al administrador.';
      }
    })();
  </script>
</body>
</html>
