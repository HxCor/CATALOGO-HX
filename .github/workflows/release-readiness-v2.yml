name: CATALOGO-HX Release Readiness V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-readiness-v2.yml'
      - 'qa/release-readiness.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hxcor.github.io/CATALOGO-HX/
      API_BASE: https://catalogo-hx-backend.armando-avila.workers.dev
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      USERS_TABLE_ID: tbleeFejdXclP3md1
      PROVIDERS_TABLE_ID: tblkWbENo3IUGAoB6
      BANKS_TABLE_ID: tblheU9qbfFJUYmDh
      QUOTES_TABLE_ID: tblqEJCKK7Ers6GWi
      RESULT_FILE: release-readiness-v2-result.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run final production audit
        id: audit
        continue-on-error: true
        run: node qa/release-readiness.mjs
      - name: Persist result
        if: always()
        run: |
          test -f "$RESULT_FILE" || printf 'CHECKED_AT_UTC=%s\nRELEASE_VERDICT=FAIL\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RESULT_FILE"
          cat "$RESULT_FILE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$RESULT_FILE"
          git commit -m "Update CATALOGO-HX release readiness V2 result" || exit 0
          git pull --rebase || true
          git push
      - name: Enforce release verdict
        if: always()
        run: |
          grep -q '^RELEASE_VERDICT=FAIL$' "$RESULT_FILE" && exit 1 || exit 0
