name: CATALOGO-HX Final Certification V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-certification-v3.yml'
      - 'certification-trigger-v3.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hxcor.github.io/CATALOGO-HX/
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      USERS_TABLE_ID: tbleeFejdXclP3md1
      RESULT_FILE: final-certification-v3-result.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production browser certification
        run: node qa/final-cert-v3.mjs
      - name: Persist result
        if: always()
        run: |
          cat "$RESULT_FILE" || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$RESULT_FILE" || true
          git commit -m "Update final certification V3 result" || exit 0
          git pull --rebase || true
          git push
      - name: Enforce certification
        if: always()
        run: |
          grep -q '^BROWSER_CERTIFICATION=PASS$' "$RESULT_FILE" || exit 1
          grep -q '^TEMP_USERS_CLEANUP=PASS$' "$RESULT_FILE" || exit 1
          grep -q '^REAL_USERS_BASELINE_RESTORED=PASS "$RESULT_FILE" || exit 1
          grep -q '^OVERALL=PASS$' "$RESULT_FILE" || exit 1
 "$RESULT_FILE" || exit 1
          grep -q '^OVERALL=PASS$' "$RESULT_FILE" || exit 1
