name: Worker security check

on:
  push:
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/worker-check.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/worker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check worker/index-fast.js
      - name: Wrangler dry-run build
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/catalogo-worker-build
      - name: Verify active password and session hardening markers
        run: |
          grep -q 'PASSWORD_PREFIX = "hmac-sha256-v1"' worker/index-fast.js
          grep -q 'Password Hash' worker/index-fast.js
          grep -q 'SESSION_TTL_SECONDS' worker/index-fast.js
          grep -q 'secretMaterial' worker/index-fast.js
          grep -q 'main = "worker/index-fast.js"' wrangler.toml
