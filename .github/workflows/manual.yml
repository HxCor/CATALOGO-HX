name: Airtable Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airtable-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Descargar Airtable a proveedores.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          curl -s -X GET \
          "https://api.airtable.com/v0/appVZGkndj6o8CyV0/Proveedores" \
          -H "Authorization: Bearer $AIRTABLE_TOKEN" \
          | jq '.records | map(select(.fields.Empresa != null)) | map({
              id: .id,
              empresa: .fields.Empresa,
              categoria: .fields.Categoria,
              ciudad: .fields.Ciudad,
              estado: .fields.Estado,
              sitioWeb: .fields["Sitio Web"],
              attachments: .fields.Attachments
            })' > proveedores.json

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add proveedores.json
          git commit -m "Actualizar proveedores desde Airtable" || echo "No hay cambios"
          git push
