name: Migrate legacy Catalogo HX user passwords

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-legacy-user-passwords.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://catalogo-hx-backend.armando-avila.workers.dev
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      USERS_TABLE_ID: tbleeFejdXclP3md1
      RESULT_FILE: user-password-migration-result.txt

    steps:
      - uses: actions/checkout@v4

      - name: Migrate plaintext legacy passwords through production login
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AIRTABLE_TOKEN:?AIRTABLE_TOKEN missing}"
          : "${AIRTABLE_BASE_ID:?AIRTABLE_BASE_ID missing}"
          : > "$RESULT_FILE"
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RESULT_FILE"

          curl -fsS \
            -H "Authorization: Bearer $AIRTABLE_TOKEN" \
            "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/$USERS_TABLE_ID?pageSize=100" \
            > /tmp/users.json

          candidates=$(jq '[.records[] | select((.fields["Contraseña"] // "") != "" and (.fields["Password Hash"] // "") == "")] | length' /tmp/users.json)
          echo "LEGACY_CANDIDATES=$candidates" >> "$RESULT_FILE"

          migrated=0
          failed=0

          while IFS=$'\t' read -r record_id username password; do
            [ -n "$record_id" ] || continue
            [ -n "$username" ] || { failed=$((failed+1)); continue; }
            [ -n "$password" ] || { failed=$((failed+1)); continue; }

            jq -n --arg usuario "$username" --arg password "$password" '{usuario:$usuario,password:$password}' > /tmp/login.json
            code=$(curl -sS -o /tmp/login-response.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/login.json "$API_BASE/login")

            if [ "$code" != "200" ]; then
              failed=$((failed+1))
              continue
            fi

            curl -fsS -H "Authorization: Bearer $AIRTABLE_TOKEN" \
              "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/$USERS_TABLE_ID/$record_id" \
              > /tmp/verify.json

            plain=$(jq -r '.fields["Contraseña"] // ""' /tmp/verify.json)
            hash=$(jq -r '.fields["Password Hash"] // ""' /tmp/verify.json)
            if [ -z "$plain" ] && [ -n "$hash" ]; then
              migrated=$((migrated+1))
            else
              failed=$((failed+1))
            fi
          done < <(jq -r '.records[] | select((.fields["Contraseña"] // "") != "" and (.fields["Password Hash"] // "") == "") | [.id, (.fields["Usuario"] // .fields["Usuario (login)"] // ""), .fields["Contraseña"]] | @tsv' /tmp/users.json)

          rm -f /tmp/login.json /tmp/login-response.json /tmp/verify.json /tmp/users.json
          echo "MIGRATED_USERS=$migrated" >> "$RESULT_FILE"
          echo "FAILED_USERS=$failed" >> "$RESULT_FILE"
          if [ "$failed" -eq 0 ]; then
            echo "OVERALL=PASS" >> "$RESULT_FILE"
          else
            echo "OVERALL=FAIL" >> "$RESULT_FILE"
            exit 1
          fi
          cat "$RESULT_FILE"

      - name: Persist migration result
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RESULT_FILE" ]; then
            printf 'OVERALL=FAIL\n' > "$RESULT_FILE"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$RESULT_FILE"
          git commit -m "Update user password migration result" || exit 0
          git push
