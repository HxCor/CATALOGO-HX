name: Laboral HX Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laboral-smoke:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hxcor.github.io/CATALOGO-HX
      API_BASE: https://catalogo-hx-backend.armando-avila.workers.dev
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      USERS_TABLE_ID: tbleeFejdXclP3md1
      RESULT_FILE: laboral-smoke-result.txt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Bootstrap temporary users
        id: users
        shell: bash
        run: |
          set -Eeuo pipefail
          : > "$RESULT_FILE"
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RESULT_FILE"
          : "${AIRTABLE_TOKEN:?AIRTABLE_TOKEN missing}"
          : "${AIRTABLE_BASE_ID:?AIRTABLE_BASE_ID missing}"
          SUFFIX="$(date +%s)-$RANDOM"
          AU="lab-admin-$SUFFIX"; AP="$(openssl rand -hex 18)"
          VU="lab-viewer-$SUFFIX"; VP="$(openssl rand -hex 18)"
          jq -n --arg au "$AU" --arg ap "$AP" --arg vu "$VU" --arg vp "$VP" '{records:[
            {fields:{"Nombre completo":"Laboral Temporary Admin","Usuario":$au,"Usuario (login)":$au,"Contraseña":$ap,"Rol":"admin"}},
            {fields:{"Nombre completo":"Laboral Temporary Viewer","Usuario":$vu,"Usuario (login)":$vu,"Contraseña":$vp,"Rol":"viewer","Empresas permitidas":"GCO1110249CA"}}
          ]}' > /tmp/users.json
          curl -fsS -X POST -H "Authorization: Bearer $AIRTABLE_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/users.json "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/$USERS_TABLE_ID" > /tmp/created.json
          AID=$(jq -r '.records[0].id // empty' /tmp/created.json); VID=$(jq -r '.records[1].id // empty' /tmp/created.json)
          test -n "$AID" && test -n "$VID"
          { echo "au=$AU"; echo "ap=$AP"; echo "vu=$VU"; echo "vp=$VP"; echo "aid=$AID"; echo "vid=$VID"; } >> "$GITHUB_OUTPUT"
          echo "TEMP_USERS=PASS" >> "$RESULT_FILE"

      - name: Validate Laboral HX
        id: smoke
        env:
          ADMIN_USER: ${{ steps.users.outputs.au }}
          ADMIN_PASS: ${{ steps.users.outputs.ap }}
          VIEWER_USER: ${{ steps.users.outputs.vu }}
          VIEWER_PASS: ${{ steps.users.outputs.vp }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "SMOKE_STEP_ERROR=line_${LINENO}" >> "$RESULT_FILE"' ERR

          FRONT_OK=0
          for i in $(seq 1 36); do
            LAB=$(curl -fsSL "$SITE_URL/laboral-hx.js?probe=$(date +%s)" 2>/dev/null || true)
            ACCESS=$(curl -fsSL "$SITE_URL/laboral-access.js?probe=$(date +%s)" 2>/dev/null || true)
            DISMISS=$(curl -fsSL "$SITE_URL/laboral-despido.js?probe=$(date +%s)" 2>/dev/null || true)
            if printf '%s' "$LAB" | grep -q 'Laboral HX' && printf '%s' "$ACCESS" | grep -q 'syncLaboralAccess' && printf '%s' "$DISMISS" | grep -q 'despido_injustificado'; then
              FRONT_OK=1
              break
            fi
            sleep 5
          done
          test "$FRONT_OK" = "1"
          echo "FRONTEND_MODULES=PASS" >> "$RESULT_FILE"

          ADMIN_TOKEN=$(curl -fsS -X POST -H 'Content-Type: application/json' --data "{\"usuario\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" "$API_BASE/login" | jq -r '.token // empty')
          VIEWER_TOKEN=$(curl -fsS -X POST -H 'Content-Type: application/json' --data "{\"usuario\":\"$VIEWER_USER\",\"password\":\"$VIEWER_PASS\"}" "$API_BASE/login" | jq -r '.token // empty')
          test -n "$ADMIN_TOKEN" && test -n "$VIEWER_TOKEN"
          echo "ADMIN_LOGIN=PASS" >> "$RESULT_FILE"; echo "VIEWER_LOGIN=PASS" >> "$RESULT_FILE"

          PARAM_OK=0
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/params.json -w '%{http_code}' -H "Authorization: Bearer $ADMIN_TOKEN" "$API_BASE/laboral/parameters")
            if [ "$CODE" = "200" ] && jq -e '.ok == true and .values.UMA_DIARIA_2026 == 117.31 and .values.SMG_GENERAL_2026 == 315.04 and .values.INDEMNIZACION_CONSTITUCIONAL_MESES == 3 and .values.ART50_DIAS_ANIO_INDETERMINADO == 20 and (.disclaimer|length>40)' /tmp/params.json >/dev/null; then
              PARAM_OK=1
              break
            fi
            sleep 5
          done
          test "$PARAM_OK" = "1"
          echo "PARAMETERS_API=PASS" >> "$RESULT_FILE"

          VC=$(curl -sS -o /tmp/v.json -w '%{http_code}' -H "Authorization: Bearer $VIEWER_TOKEN" "$API_BASE/laboral/parameters")
          test "$VC" = "200"
          jq -e '.ok == true' /tmp/v.json >/dev/null
          echo "VIEWER_API_ACCESS=PASS" >> "$RESULT_FILE"

          curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data '{"scenario":"prestaciones","startDate":"2026-01-01","endDate":"2026-12-31","monthlySalary":30000,"region":"general","aguinaldoDays":15,"vacationPremiumPct":25,"plantWorker":true}' "$API_BASE/laboral/calculate" > /tmp/calc.json
          jq -e '.ok == true and .result.calculations.aguinaldo == 15000 and .result.calculations.vacaciones == 12000 and .result.calculations.primaVacacional == 3000 and .result.calculations.total == 30000 and (.result.legalBasis|length==4)' /tmp/calc.json >/dev/null
          echo "BASE_CALCULATION_ENGINE=PASS" >> "$RESULT_FILE"

          cat > /tmp/dismissal.json <<'JSON'
          {
            "scenario":"despido_injustificado",
            "relationType":"indeterminado",
            "employeeName":"Prueba Laboral",
            "startDate":"2025-01-01",
            "endDate":"2026-01-01",
            "monthlySalary":30000,
            "region":"general",
            "aguinaldoDays":15,
            "vacationPremiumPct":25,
            "plantWorker":true,
            "art49Confirmed":false,
            "backPayMonths":0
          }
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/dismissal.json "$API_BASE/laboral/dismissal" > /tmp/dismissal-out.json
          jq -e '.ok == true and .result.calculations.indemnizacionConstitucional > 0 and .result.calculations.indemnizacionArt50 == 0 and .result.calculations.totalBaseEstimado > .result.calculations.finiquito and (.result.disclaimer|length>40) and ([.result.legalBasis[].articles] | join(" ") | contains("48"))' /tmp/dismissal-out.json >/dev/null
          echo "DISMISSAL_BASE_ENGINE=PASS" >> "$RESULT_FILE"

          jq '.art49Confirmed=true' /tmp/dismissal.json > /tmp/dismissal-art50.json
          curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/dismissal-art50.json "$API_BASE/laboral/dismissal" > /tmp/dismissal-art50-out.json
          jq -e '.ok == true and .result.calculations.indemnizacionArt50 > 0 and .result.calculations.art49Confirmed == true and ([.result.legalBasis[].articles] | join(" ") | contains("49 y 50"))' /tmp/dismissal-art50-out.json >/dev/null
          echo "DISMISSAL_ART50_GUARD=PASS" >> "$RESULT_FILE"

          jq '.scenario="despido_justificado" | .art49Confirmed=false' /tmp/dismissal.json > /tmp/dismissal-justified.json
          curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/dismissal-justified.json "$API_BASE/laboral/dismissal" > /tmp/dismissal-justified-out.json
          jq -e '.ok == true and .result.calculations.indemnizacionConstitucional == 0 and .result.calculations.indemnizacionArt50 == 0 and ([.result.legalBasis[].articles] | join(" ") | contains("46 y 47"))' /tmp/dismissal-justified-out.json >/dev/null
          echo "DISMISSAL_JUSTIFIED_GUARD=PASS" >> "$RESULT_FILE"

          DVC=$(curl -sS -o /tmp/dismissal-viewer.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VIEWER_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/dismissal.json "$API_BASE/laboral/dismissal")
          test "$DVC" = "403"
          echo "DISMISSAL_VIEWER_RESTRICTION=PASS" >> "$RESULT_FILE"

          cat > laboral-ui-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const append = s => fs.appendFileSync(process.env.RESULT_FILE, s + '\n');
          const browser = await chromium.launch({headless:true});
          async function login(page,u,p){
            await page.goto(`${process.env.SITE_URL}/?lab=${Date.now()}-${Math.random()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#loginUser').waitFor({state:'visible',timeout:30000});
            await page.locator('#loginUser').fill(u); await page.locator('#loginPass').fill(p); await page.locator('#btnLogin').click();
            await page.waitForFunction(()=>document.body.classList.contains('logged-in'),null,{timeout:30000});
          }
          try {
            const a=await browser.newContext({viewport:{width:1440,height:1000}}), page=await a.newPage();
            await login(page,process.env.ADMIN_USER,process.env.ADMIN_PASS);
            await page.locator('#hxLaboralBtn').waitFor({state:'visible',timeout:20000}); append('ADMIN_MENU=PASS');
            await page.locator('#hxLaboralBtn').click();
            await page.locator('#hxlabCalculate').waitFor({state:'visible',timeout:15000}); append('ADMIN_LABORAL_VIEW=PASS');
            await page.locator('#hxlabDismissalPanel').waitFor({state:'visible',timeout:15000}); append('DISMISSAL_UI=PASS');
            if(!/NO ES DETERMINACIÓN OFICIAL/i.test(await page.locator('.hxlab-notice').first().innerText())) throw new Error('Aviso legal no visible'); append('LEGAL_NOTICE=PASS');
            await page.locator('#hxlabScenario').selectOption('prestaciones'); await page.locator('#hxlabStart').fill('2026-01-01'); await page.locator('#hxlabEnd').fill('2026-12-31'); await page.locator('#hxlabMonthly').fill('30000'); await page.locator('#hxlabCalculate').click();
            await page.waitForFunction(()=>/Total bruto estimado/i.test(document.querySelector('#hxlabResult')?.innerText||''),null,{timeout:20000}); append('ADMIN_CALCULATION_UI=PASS');
            await page.locator('#hxldStart').fill('2025-01-01'); await page.locator('#hxldEnd').fill('2026-01-01'); await page.locator('#hxldMonthly').fill('30000'); await page.locator('#hxldCalculate').click();
            await page.waitForFunction(()=>/Total base estimado/i.test(document.querySelector('#hxldResult')?.innerText||''),null,{timeout:20000}); append('DISMISSAL_CALCULATION_UI=PASS');
            await a.close();
            const v=await browser.newContext({viewport:{width:390,height:844}}), vp=await v.newPage(); await login(vp,process.env.VIEWER_USER,process.env.VIEWER_PASS);
            if(!await vp.locator('#hxLaboralBtn').isVisible().catch(()=>false)) throw new Error('Laboral no visible para viewer'); append('VIEWER_UI_ACCESS=PASS'); await v.close();
            append('ADMIN_UI=PASS');
          } catch(e) { append(`UI_ERROR=${String(e.message||e).replace(/\s+/g,' ').slice(0,500)}`); throw e; }
          finally { await browser.close(); }
          JS
          RESULT_FILE="$RESULT_FILE" SITE_URL="$SITE_URL" ADMIN_USER="$ADMIN_USER" ADMIN_PASS="$ADMIN_PASS" VIEWER_USER="$VIEWER_USER" VIEWER_PASS="$VIEWER_PASS" node laboral-ui-smoke.mjs
          echo "OVERALL=PASS" >> "$RESULT_FILE"

      - name: Cleanup temporary users
        if: always()
        env:
          AID: ${{ steps.users.outputs.aid }}
          VID: ${{ steps.users.outputs.vid }}
        run: |
          set +e
          for id in "$AID" "$VID"; do [ -z "$id" ] || curl -sS -X DELETE -H "Authorization: Bearer $AIRTABLE_TOKEN" "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/$USERS_TABLE_ID/$id" >/dev/null; done

      - name: Persist result
        if: always()
        run: |
          grep -q '^OVERALL=' "$RESULT_FILE" || echo "OVERALL=FAIL" >> "$RESULT_FILE"
          git config user.name github-actions; git config user.email github-actions@github.com
          git add "$RESULT_FILE"; git commit -m "Update Laboral HX smoke result" || exit 0
          git pull --rebase || true; git push

      - name: Fail on smoke error
        if: steps.smoke.outcome != 'success'
        run: exit 1
